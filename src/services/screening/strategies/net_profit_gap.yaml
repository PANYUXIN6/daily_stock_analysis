name: net_profit_gap
display_name: 净利润断层
description: 净利润大幅增长、公告下一交易日跳空涨停、缺口至观察日未回补，同时验证扣非质量。需 Tushare 财务及行情权限；证据不足不入选。
version: "1.0"
category: framework
tags: [earnings, profit_gap, event_driven, quality]
analysis_skills: [growth_quality]
style:
  risk_profile: aggressive
  holding_period: swing
  execution_style: event_driven
  market_regime: [risk_on, trend]
  capital_profile: institutional
  ui_badge: 业绩
screening:
  enabled: true
  market_scope: [cn]
  hard_filters:
    exclude_st: true
  profit_gap:
    event_lookback_days: 90
    min_profit_yoy_pct: 50
    min_core_profit_ratio: 0.8
    min_observation_days: 1
    volume_baseline_days: 20
    volume_peak_ratio: 2
    volume_stable_cv: 0.2
    timeout_seconds: 180
  factor_weights:
    value: 0.30
    stability: 0.25
    liquidity: 0.20
    momentum: 0.15
    activity: 0.10
  ranking_hints: |
    净利润大幅增长、次日跳空涨停、缺口未回补与扣非质量已由程序过滤。
    本策略不评估研报一致预期，不得将筛选通过表述为已验证超市场预期。
    同等条件优先主营增长持续、行业景气、相对估值合理的公司。
    若有可核实的机构增持或买入记录，在基本面与估值可比时优先；需注明披露日期。
    成交量阶段只描述截至观察日的形态，不是机构建仓或未来收益的证明。
    机构持仓、买入证据缺失时明确待核实，不得从涨停或缩量推断主力身份。
  max_output: 5
